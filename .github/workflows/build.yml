name: Build Minecraft 1.20.1 Quilt Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build with Gradle
      run: gradle build

    - name: Upload built Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: Natural-Disasters-Quilt-1.20.1
        path: build/libs/*.jar
