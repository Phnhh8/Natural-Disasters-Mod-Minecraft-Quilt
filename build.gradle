plugins {
    id 'org.quiltmc.loom' version '1.5.4'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.disasters'
base.archivesName = 'naturaldisasters-quilt-1.20.1'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "org.quiltmc:quilt-loader:0.26.4"
    modImplementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:7.4.0+0.92.2-1.20.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

tasks.register('generateAssets') {
    doLast {
        def baseDir = file("$buildDir/generated/resources/assets/naturaldisasters")
        new File(baseDir, "models/item").mkdirs()

        def icons = [
            meteor_caller: "fire_charge", earthquake_caller: "flint", acid_rain_caller: "slime_ball",
            tornado_caller: "feather", landslide_caller: "clay_ball", nuke_caller: "tnt",
            tsunami_caller: "water_bucket", volcano_caller: "magma_cream", sinkhole_caller: "ender_pearl",
            lightning_caller: "blaze_rod", blizzard_caller: "snowball", zombie_caller: "rotten_flesh",
            disaster_stopper: "barrier"
        ]
        icons.each { id, tex ->
            if (id == "nuke_caller") {
                new File(baseDir, "models/item/${id}.json").setText("""{"parent":"minecraft:block/tnt"}""", 'UTF-8')
            } else {
                new File(baseDir, "models/item/${id}.json").setText("""{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/${tex}"}}""", 'UTF-8')
            }
        }
    }
}

sourceSets.main.resources.srcDir "$buildDir/generated/resources"
processResources {
    dependsOn('generateAssets')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
