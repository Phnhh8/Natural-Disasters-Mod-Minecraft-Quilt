plugins {
    id 'java'
    id 'org.quiltmc.loom' version '1.15.1'
}

version = '1.0.0'
group = 'com.example.disasters'

base {
    archivesName = 'naturaldisasters-quilt-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = 'Quilt'
        url = 'https://' + 'maven.' + 'quiltmc.org/repository/release/'
    }
    maven {
        name = 'Fabric'
        url = 'https://' + 'maven.' + 'fabricmc.net/'
    }
    maven {
        name = 'GoogleMavenMirror'
        url = 'https://' + 'maven-central.storage-download.' + '://googleapis.com'
    }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'org.quiltmc:quilt-loader:0.27.1'
    modImplementation 'org.quiltmc.quilted-fabric-api:quilted-fabric-api:11.0.0-alpha.3+0.102.0-1.21'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
